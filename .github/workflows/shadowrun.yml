# Every migration in a pull request is rehearsed on a clone of prod, and the result is posted on the PR.
name: Rehearse migrations
on:
  pull_request:
    paths: ["examples/migrations/*.sql"]
permissions:
  contents: read
  pull-requests: write
jobs:
  rehearse:
    # Forks have no secrets, so only rehearse pull requests from this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        env:
          BASE: ${{ github.base_ref }}
        run: |
          file="$(git diff --name-only "origin/$BASE" HEAD -- 'examples/migrations/*.sql' | head -1)"
          echo "plan=$file" >> "$GITHUB_OUTPUT"
      # This repository's example rehearses on the public demo, whose guest session anyone can get.
      # On your own deployment, store SHADOWRUN_URL and SHADOWRUN_TOKEN as secrets instead.
      - id: session
        env:
          URL: ${{ secrets.SHADOWRUN_URL || 'https://144-202-92-64.sslip.io' }}
          TOKEN: ${{ secrets.SHADOWRUN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            TOKEN="$(curl -fsS -X POST "$URL/api/demo/enter" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
          fi
          echo "::add-mask::$TOKEN"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          plan: ${{ steps.files.outputs.plan }}
          url: ${{ steps.session.outputs.url }}
          token: ${{ steps.session.outputs.token }}
