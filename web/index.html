<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Your agent wants to touch prod. Shadow Run lets it break a clone first." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c0b" />
    <title>Shadow Run</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Painted before any stylesheet arrives, so there is no white flash. -->
    <style>
      html { background: #0a0c0b; }
      html[data-theme='light'] { background: #f4f2ea; }
    </style>
    <script>
      try {
        var saved = localStorage.getItem('sr.theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
