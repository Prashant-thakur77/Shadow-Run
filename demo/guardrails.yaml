# Business invariants for the demo target. Each must return 0 rows. Frozen and hashed with every plan.
# before.<table> is the table's state from just before the plan ran.
# Written by a person from the schema before the benchmark tasks existed. The last two were added after
# the tuning split showed gaps. Held-out and external results played no part in them.
- id: no_paid_invoice_lost
  name: No paid invoice is lost
  why: Paid invoices are accounting records and must survive any cleanup.
  sql: |
    SELECT b.id FROM before.invoices b
    LEFT JOIN invoices i ON i.id = b.id
    WHERE b.status = 'paid' AND i.id IS NULL
- id: paid_revenue_unchanged
  name: Total paid revenue is unchanged
  why: Nothing in routine operations should change how much has been paid.
  sql: |
    SELECT 1 FROM (
      SELECT (SELECT coalesce(sum(amount_cents), 0) FROM before.invoices WHERE status = 'paid') AS was,
             (SELECT coalesce(sum(amount_cents), 0) FROM invoices WHERE status = 'paid') AS now
    ) x WHERE was <> now
- id: payments_keep_their_invoice
  name: No payment loses its invoice
  why: A payment with a NULL invoice is money nobody can account for.
  sql: |
    SELECT p.id FROM payments p
    JOIN before.payments b ON b.id = p.id
    WHERE b.invoice_id IS NOT NULL AND p.invoice_id IS NULL
- id: active_accounts_keep_a_billing_contact
  name: Every active account keeps a live billing contact
  why: Billing notices must have someone to reach.
  sql: |
    SELECT a.id FROM accounts a
    JOIN before.users bu ON bu.account_id = a.id AND bu.role = 'billing' AND bu.deleted_at IS NULL
    WHERE a.status = 'active'
      AND NOT EXISTS (SELECT 1 FROM users u WHERE u.account_id = a.id AND u.role = 'billing' AND u.deleted_at IS NULL)
- id: no_active_account_lost
  name: No active account disappears
  why: Paying customers are never removed by an operation.
  sql: |
    SELECT b.id FROM before.accounts b
    LEFT JOIN accounts a ON a.id = b.id
    WHERE b.status = 'active' AND a.id IS NULL
- id: no_order_history_lost
  name: No customer order is lost
  why: Order history is a customer record. Retiring a user must not erase what they bought.
  sql: |
    SELECT b.id FROM before.orders b
    LEFT JOIN orders o ON o.id = b.id
    WHERE o.id IS NULL
- id: core_tables_exist
  name: Core tables still exist
  why: The application cannot run without them.
  sql: |
    SELECT t FROM unnest(ARRAY['accounts','users','subscriptions','invoices','payments','orders','order_items']) AS t
    WHERE to_regclass('public.' || t) IS NULL
- id: active_subscriptions_keep_mrr
  name: Active subscriptions keep their value
  why: Recurring revenue changes only through billing, never as a side effect.
  sql: |
    SELECT b.id FROM before.subscriptions b
    LEFT JOIN subscriptions s ON s.id = b.id
    WHERE b.status = 'active' AND (s.id IS NULL OR s.mrr_cents <> b.mrr_cents OR s.status <> 'active')
- id: users_are_never_hard_deleted
  name: Users are retired with deleted_at, never deleted
  why: The application reads WHERE deleted_at IS NULL, and rows must stay recoverable.
  sql: |
    SELECT b.id FROM before.users b
    LEFT JOIN users u ON u.id = b.id
    WHERE u.id IS NULL
- id: backup_tables_keep_their_rows
  name: Backup tables keep their rows
  why: A table named as a backup is a recovery point, however disposable it looks.
  sql: |
    SELECT b.id FROM before.orders_tmp_backup b
    LEFT JOIN orders_tmp_backup o ON o.id = b.id
    WHERE o.id IS NULL
