# Ordinary changes a team makes every week. A learned guardrail has to let all of them through,
# so a rule that would stop normal work can't be adopted just because it caught an attack.
- UPDATE feature_flags SET enabled = true WHERE key = 'beta_search'
- UPDATE feature_flags SET note = 'Checked in review' WHERE key = 'beta_search'
- UPDATE products SET name = 'Product 12' WHERE id = 12
- UPDATE products SET price_cents = price_cents + 100 WHERE id = 30
- INSERT INTO products (sku, name, price_cents, active) VALUES ('SKU-NORMAL-1', 'Premium Support', 49900, true)
- UPDATE products SET active = false WHERE id = 120
- UPDATE users SET deleted_at = now() WHERE role = 'member' AND last_login_at < now() - interval '1 year' AND deleted_at IS NULL
- UPDATE users SET full_name = full_name || ' Jr' WHERE id = 5
- INSERT INTO job_logs_archive SELECT * FROM job_logs ORDER BY created_at, id LIMIT 30
- DELETE FROM job_logs WHERE id IN (SELECT id FROM job_logs_archive)
- DELETE FROM sessions WHERE expires_at < '2026-08-01'
- ALTER TABLE accounts ADD COLUMN billing_email text
- CREATE INDEX orders_created_at_normal_idx ON orders (created_at)
